<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Aetheria: Legends Unbound</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:      #08031A;
      --bg-card:      #1C0F38;
      --primary:      #7C3AED;
      --primary-light:#A78BFA;
      --secondary:    #DB2777;
      --text:         #F0EAFF;
      --text-muted:   #8B7EC8;
      --border:       rgba(167,139,250,0.18);
      --success:      #059669;
    }

    html, body {
      height: 100%;
      background: var(--bg-deep);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Stars background ───────────────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 10%  15%, rgba(167,139,250,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 25%  40%, rgba(167,139,250,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 45%  8%,  rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 60%  55%, rgba(167,139,250,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 75%  20%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 85%  70%, rgba(167,139,250,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 90%  35%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 35%  80%, rgba(167,139,250,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 55%  90%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 15%  65%, rgba(167,139,250,0.3) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Gradient orbs ─────────────────────────────────────── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 20% 10%,  rgba(124,58,237,0.12) 0%, transparent 70%),
        radial-gradient(ellipse 50% 35% at 80% 80%,  rgba(219,39,119,0.10) 0%, transparent 70%),
        radial-gradient(ellipse 40% 50% at 50% 50%,  rgba(124,58,237,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Layout ────────────────────────────────────────────── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      gap: 0;
    }

    /* ── Card ──────────────────────────────────────────────── */
    .card {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(135deg, rgba(255,255,255,0.025), rgba(255,255,255,0.04));
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px 36px;
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: rise 0.6s cubic-bezier(0.16,1,0.3,1) both;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(167,139,250,0.5), transparent);
    }

    /* ── Success ring ──────────────────────────────────────── */
    .ring {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin: 0 auto 24px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pop 0.5s 0.3s cubic-bezier(0.16,1,0.3,1) both;
    }

    .ring::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #7C3AED, #DB2777, #7C3AED);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), white calc(100% - 3px));
              mask: radial-gradient(farthest-side, transparent calc(100% - 3px), white calc(100% - 3px));
      animation: spin 3s linear infinite;
    }

    .ring-inner {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(124,58,237,0.3), rgba(219,39,119,0.2));
      border: 1px solid rgba(124,58,237,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }

    /* ── Wordmark ──────────────────────────────────────────── */
    .wordmark {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--primary-light), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
      opacity: 0;
      animation: fade-up 0.5s 0.4s ease both;
    }

    .subtitle-game {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 28px;
      opacity: 0;
      animation: fade-up 0.5s 0.45s ease both;
    }

    /* ── Divider ───────────────────────────────────────────── */
    .divider {
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(167,139,250,0.4), transparent);
      margin: 0 auto 24px;
      opacity: 0;
      animation: fade-up 0.5s 0.5s ease both;
    }

    /* ── Heading ───────────────────────────────────────────── */
    .heading {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: var(--text);
      margin-bottom: 10px;
      opacity: 0;
      animation: fade-up 0.5s 0.55s ease both;
    }

    .heading span {
      background: linear-gradient(90deg, var(--primary-light), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Body text ─────────────────────────────────────────── */
    .body-text {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 28px;
      opacity: 0;
      animation: fade-up 0.5s 0.6s ease both;
    }

    /* ── Step box ──────────────────────────────────────────── */
    .step-box {
      background: rgba(124,58,237,0.08);
      border: 1px solid rgba(124,58,237,0.22);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
      text-align: left;
      opacity: 0;
      animation: fade-up 0.5s 0.65s ease both;
    }

    .step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }
    .step:last-child { margin-bottom: 0; }

    .step-num {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 900;
      color: #fff;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .step-text {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.5;
    }
    .step-text em {
      font-style: normal;
      color: var(--primary-light);
    }

    /* ── Footer ────────────────────────────────────────────── */
    .footer {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
      opacity: 0;
      animation: fade-up 0.5s 0.7s ease both;
    }

    /* ── Animations ────────────────────────────────────────── */
    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(0.5); }
      to   { opacity: 1; transform: scale(1); }
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Particles (pure CSS) ──────────────────────────────── */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      animation: float linear infinite;
      opacity: 0;
    }

    @keyframes float {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.6; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Floating particles -->
  <div class="particles" id="particles"></div>

  <div class="page">
    <div class="card">

      <!-- Spinning ring with checkmark -->
      <div class="ring">
        <div class="ring-inner">✦</div>
      </div>

      <p class="wordmark">Aetheria</p>
      <p class="subtitle-game">Legends Unbound</p>

      <div class="divider"></div>

      <h1 class="heading">Email <span>Verified</span></h1>

      <p class="body-text">
        Your identity has been confirmed.<br />
        Return to the app to begin your journey.
      </p>

      <div class="step-box">
        <div class="step">
          <div class="step-num">1</div>
          <p class="step-text">Open the <em>Aetheria</em> app on your device</p>
        </div>
        <div class="step">
          <div class="step-num">2</div>
          <p class="step-text">Tap <em>"I've Verified — Continue"</em> on the screen</p>
        </div>
        <div class="step">
          <div class="step-num">3</div>
          <p class="step-text">Your progress will sync across all devices</p>
        </div>
      </div>

      <p class="footer">ziriverse.com · Aetheria Legends</p>

    </div>
  </div>

  <script>
    // Spawn floating particles
    (function () {
      var colors = ['rgba(124,58,237,0.5)', 'rgba(219,39,119,0.4)', 'rgba(167,139,250,0.4)'];
      var container = document.getElementById('particles');
      for (var i = 0; i < 18; i++) {
        var p = document.createElement('div');
        p.className = 'particle';
        var size = Math.random() * 4 + 2;
        p.style.cssText = [
          'width:'  + size + 'px',
          'height:' + size + 'px',
          'left:'   + Math.random() * 100 + '%',
          'background:' + colors[Math.floor(Math.random() * colors.length)],
          'animation-duration:' + (Math.random() * 10 + 8) + 's',
          'animation-delay:'    + (Math.random() * 10)      + 's',
        ].join(';');
        container.appendChild(p);
      }
    })();
  </script>

</body>
</html>
